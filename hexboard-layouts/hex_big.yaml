name: Big QWERTY
description: QWERTY order on four rows of seven larger keys. Rare letters sit on the top row.
attributes: { moreKeyMode: OnlyFromLetter }
rows:
  - letters: [[q, "1"], z, x, [y, "6"], j, k, [p, "0"]]
  - letters: [[w, "2"], [e, "3"], [r, "4"], [t, "5"], [u, "7"], [i, "8"], [o, "9"]]
  - letters: "a s d f g h l"
  - letters: "$shift c v b n m $delete"
